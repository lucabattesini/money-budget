name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    # This job name is what a branch rule must require to block merges
    name: Back-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U money"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The suite creates the money_budget_test database itself
      TEST_DB_URL: postgresql+psycopg2://money:money@localhost:5432/money_budget_test

    defaults:
      run:
        working-directory: back-end

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # -rs lists the skipped tests (known bugs) with their ticket numbers
      - name: Run tests
        run: python -m pytest -rs --cov=api --cov=graph --cov=db --cov-report=term
