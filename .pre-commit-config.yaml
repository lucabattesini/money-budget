# One-time setup:  pip install pre-commit && pre-commit install --install-hooks

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^back-end/
      - id: ruff-format
        files: ^back-end/

  - repo: local
    hooks:
      # Runs inside the `web` container because npm on the host does not work
      # while the stack is up (see README). Start it first: docker compose up -d
      - id: eslint
        name: eslint (front-end)
        entry: docker compose exec -T web npm run lint
        language: system
        files: ^front-end/
        pass_filenames: false
