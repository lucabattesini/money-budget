# One-time setup:  pip install pre-commit && pre-commit install --install-hooks
# (installs both the commit and the commit-msg hooks)
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^back-end/
      - id: ruff-format
        files: ^back-end/

  - repo: local
    hooks:
      - id: commit-message
        name: commit message starts with MB-NNNN
        entry: python back-end/scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
