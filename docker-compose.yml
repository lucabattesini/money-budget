# Local development environment: Postgres + FastAPI + Vite.
#   cp .env.example .env   (single env file at the repo root)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money}
      POSTGRES_DB: ${POSTGRES_DB:-money_budget}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./back-end
    # Apply the database migrations (Alembic), seed the default categories, then serve.
    command: >
      sh -c "python -m db.upgrade &&
             python -m db.seed &&
             uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: ./.env
        required: false
    environment:
      DB_URL: postgresql+psycopg2://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-money}@db:5432/${POSTGRES_DB:-money_budget}
      # Separate database used by `pytest` (created automatically, never the dev one)
      TEST_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-money}:${POSTGRES_PASSWORD:-money}@db:5432/${POSTGRES_DB:-money_budget}_test
    ports:
      - "8000:8000"
    volumes:
      - ./back-end:/app
    healthcheck:
      # No curl in the slim image, so use Python; /docs is served without login
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./front-end
    env_file:
      - path: ./.env
        required: false
    ports:
      - "5173:5173"
    volumes:
      - ./front-end:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  web_node_modules:
