# Alembic configuration. Run the commands from the back-end folder (inside the api container):
#   docker compose exec api alembic revision --autogenerate -m "describe the change"
#   docker compose exec api python -m db.upgrade        # apply (also what start-up does)
[alembic]
script_location = migrations
# The database comes from DB_URL (see migrations/env.py), not from this file.
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

# A new revision is tidied with the project's linter, so it passes the same checks as the rest of the code
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
